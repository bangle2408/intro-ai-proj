[project]
name = "chess-ai-project"
version = "0.2.0"
description = "Desktop chess, classical search and reproducible matches"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["core", "services", "ui", "utils", "config", "assets"]
py-modules = ["game"]

[tool.setuptools.package-data]
config = ["*.yaml", "*/*.yaml"]
assets = ["*.bin", "pieces/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
